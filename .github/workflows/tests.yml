name: Lint & Tests (manuel)

on:
    workflow_dispatch:
        inputs:
            reason:
                description: 'Raison du déclenchement manuel (optionnel)'
                required: false
                default: 'Vérification manuelle'

jobs:
    lint-and-test:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout du code
              uses: actions/checkout@v4

            - name: Installer Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '24'
                  cache: 'npm'

            - name: Installer les dépendances
              run: npm ci

            - name: Lint
              run: npm run lint

            - name: Vérification du formatage
              run: npm run format:check

            - name: Tests unitaires & intégration
              run: npm run test
