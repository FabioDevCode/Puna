name: 🐛 Bug report
description: Signaler un comportement anormal ou un dysfonctionnement
title: '[Bug] '
labels: ['bug']
body:
    - type: markdown
      attributes:
          value: |
              Merci de prendre le temps de signaler ce bug !
              ⚠️ Si vous pensez avoir trouvé une faille de sécurité, ne créez pas d'issue ici - consultez [SECURITY.md](../../SECURITY.md).

    - type: textarea
      id: description
      attributes:
          label: Description du problème
          description: Une description claire et concise du bug rencontré
          placeholder: Ex. La création d'un formulaire échoue silencieusement quand...
      validations:
          required: true

    - type: textarea
      id: reproduction
      attributes:
          label: Étapes de reproduction
          description: Comment reproduire le problème, étape par étape
          placeholder: |
              1. Aller sur '...'
              2. Cliquer sur '...'
              3. Constater l'erreur
      validations:
          required: true

    - type: textarea
      id: expected
      attributes:
          label: Comportement attendu vs observé
          description: Que devrait-il se passer ? Que se passe-t-il réellement ?
      validations:
          required: true

    - type: dropdown
      id: install-mode
      attributes:
          label: Mode d'installation
          options:
              - Docker
              - Natif (Node.js)
      validations:
          required: true

    - type: input
      id: node-version
      attributes:
          label: Version de Node.js
          placeholder: Ex. 24.2.0
      validations:
          required: false

    - type: input
      id: os
      attributes:
          label: Système d'exploitation
          placeholder: Ex. Ubuntu 24.04, macOS 15, Windows 11
      validations:
          required: true

    - type: textarea
      id: logs
      attributes:
          label: Logs ou messages d'erreur
          description: Collez ici les logs pertinents, le cas échéant
          render: shell
      validations:
          required: false
