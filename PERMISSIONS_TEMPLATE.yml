# ================================================================
# TEMPLATE DE DÉFINITION DES PERMISSIONS
# ================================================================
# Instructions:
# 1. Pour chaque rôle, définir les permissions par entité
# 2. Utiliser true/false pour activer/désactiver une action
# 3. Ajouter des commentaires (#) pour expliquer les choix
# 4. Les actions possibles varient selon l'entité
#
# Format: permissions[role][entity][action] = boolean
# ================================================================

# ================================================================
# RÔLES DISPONIBLES (d'après user.attributes.json)
# ================================================================
roles:
    - super_admin # Administrateur système (accès total)
    - owner # Propriétaire de sites
    - editor # Éditeur (peut modifier)
    - viewer # Lecteur seul
    - beta # Testeur beta

# ================================================================
# ENTITÉS DU SYSTÈME (d'après models/)
# ================================================================
entities:
    - user # Utilisateurs du système
    - site # Sites web (domaines)
    - form # Formulaires liés à un site
    - inbox # Entrées de formulaires (données reçues)
    - dashboard # Tableau de bord et statistiques
    - admin # Panel d'administration

# ================================================================
# MATRICE DES PERMISSIONS À COMPLÉTER
# ================================================================
# Remplis les valeurs true/false selon tes besoins
# Supprime ou commente les actions qui n'ont pas de sens
# ================================================================

permissions:
    # ------------------------------------------------------------
    # SUPER_ADMIN - Administrateur système
    # ------------------------------------------------------------
    super_admin:
        user:
            read: true # Voir détails d'un utilisateur
            list: true # Lister tous les utilisateurs
            create: true # Créer un utilisateur
            update: true # Modifier un utilisateur
            delete: true # Supprimer un utilisateur
            export: true # Exporter liste en Excel
            assign_role: true # Changer le rôle d'un utilisateur

        site:
            read: true # Voir détails d'un site
            list: true # Lister tous les sites
            create: true # Créer un site
            update: true # Modifier un site
            delete: true # Supprimer un site
            manage_tokens: true # Générer/révoquer tokens JWT
            assign_users: true # Assigner des utilisateurs au site (via SiteUser)

        form:
            read: true # Voir détails d'un formulaire
            list: true # Lister tous les formulaires
            create: true # Créer un formulaire
            update: true # Modifier un formulaire (colonnes, template)
            delete: true # Supprimer un formulaire
            export: true # Exporter données en Excel

        inbox:
            read: true # Voir une entrée de formulaire
            list: true # Lister toutes les entrées
            create: false # Créer entrée (généralement via API seulement)
            update: false # Modifier une entrée (non implémenté actuellement)
            delete: true # Supprimer une entrée
            download: true # Télécharger fichiers joints
            export: true # Exporter en ZIP

        dashboard:
            read: true # Accéder au dashboard
            stats: true # Voir statistiques détaillées

        admin:
            access: true # Accéder au panel /admin
            settings: true # Modifier paramètres système

    # ------------------------------------------------------------
    # OWNER - Propriétaire de sites
    # ------------------------------------------------------------
    # Peut gérer complètement SES sites (vérification ownership requise)
    # ------------------------------------------------------------
    owner:
        user:
            read: false # ❌ Ne peut pas voir autres utilisateurs
            list: false
            create: false
            update: false
            delete: false
            export: false
            assign_role: false

        site:
            read: true # ✅ Voir SES sites uniquement
            list: true # ✅ Lister SES sites
            create: true # ✅ Créer des sites
            update: true # ✅ Modifier SES sites
            delete: true # ✅ Supprimer SES sites
            manage_tokens: true # ✅ Gérer tokens de SES sites
            assign_users: true # ✅ Assigner utilisateurs à SES sites

        form:
            read: true # ✅ Voir formulaires de SES sites
            list: true
            create: true # ✅ Créer formulaires sur SES sites
            update: true # ✅ Modifier formulaires de SES sites
            delete: true # ✅ Supprimer formulaires de SES sites
            export: true # ✅ Exporter données de SES formulaires

        inbox:
            read: true # ✅ Voir entrées de SES formulaires
            list: true
            create: false # ❌ Création via API seulement
            update: false
            delete: true # ✅ Supprimer entrées de SES formulaires
            download: true # ✅ Télécharger fichiers
            export: true # ✅ Exporter en ZIP

        dashboard:
            read: true # ✅ Accéder au dashboard
            stats: true # ✅ Voir statistiques de SES sites

        admin:
            access: false # ❌ Pas d'accès admin
            settings: false

    # ------------------------------------------------------------
    # EDITOR - Éditeur
    # ------------------------------------------------------------
    # Peut modifier mais pas créer/supprimer
    # Assigné à des sites spécifiques via SiteUser
    # ------------------------------------------------------------
    editor:
        user:
            read: false
            list: false
            create: false
            update: false
            delete: false
            export: false
            assign_role: false

        site:
            read: true # ✅ Voir sites assignés
            list: true # ✅ Lister sites assignés
            create: false # ❌ Ne peut pas créer de sites
            update: false # ❌ Ne peut pas modifier config site
            delete: false # ❌ Ne peut pas supprimer sites
            manage_tokens: false # ❌ Ne peut pas gérer tokens
            assign_users: false # ❌ Ne peut pas assigner utilisateurs

        form:
            read: true # ✅ Voir formulaires des sites assignés
            list: true
            create: false # ❌ Ne peut pas créer formulaires
            update: true # ✅ Modifier formulaires (colonnes, template)
            delete: false # ❌ Ne peut pas supprimer formulaires
            export: true # ✅ Exporter données

        inbox:
            read: true # ✅ Voir entrées
            list: true
            create: false
            update: false
            delete: false # ❌ Ne peut pas supprimer entrées
            download: true # ✅ Télécharger fichiers
            export: true # ✅ Exporter en ZIP

        dashboard:
            read: true # ✅ Accéder au dashboard
            stats: true # ✅ Voir statistiques

        admin:
            access: false
            settings: false

    # ------------------------------------------------------------
    # VIEWER - Lecteur seul
    # ------------------------------------------------------------
    # Lecture seule sur les sites assignés
    # ------------------------------------------------------------
    viewer:
        user:
            read: false
            list: false
            create: false
            update: false
            delete: false
            export: false
            assign_role: false

        site:
            read: true # ✅ Voir sites assignés
            list: true # ✅ Lister sites assignés
            create: false # ❌ Lecture seule
            update: false
            delete: false
            manage_tokens: false
            assign_users: false

        form:
            read: true # ✅ Voir formulaires
            list: true
            create: false # ❌ Lecture seule
            update: false
            delete: false
            export: false # ❌ Pas d'export pour viewer

        inbox:
            read: true # ✅ Voir entrées
            list: true
            create: false
            update: false
            delete: false
            download: true # ✅ Télécharger fichiers (lecture seule)
            export: false # ❌ Pas d'export

        dashboard:
            read: true # ✅ Accéder au dashboard
            stats: true # ✅ Voir statistiques

        admin:
            access: false
            settings: false

    # ------------------------------------------------------------
    # BETA - Testeur beta
    # ------------------------------------------------------------
    # Utilisateur en phase de test (droits limités)
    # ------------------------------------------------------------
    beta:
        user:
            read: false
            list: false
            create: false
            update: false
            delete: false
            export: false
            assign_role: false

        site:
            read: true # ✅ Voir sites (pour tester)
            list: true
            create: true # ✅ Créer sites de test
            update: false # ❌ Ne peut pas modifier
            delete: false # ❌ Ne peut pas supprimer
            manage_tokens: false
            assign_users: false

        form:
            read: true # ✅ Voir formulaires
            list: true
            create: false # ❌ Ne peut pas créer formulaires
            update: false
            delete: false
            export: false

        inbox:
            read: true # ✅ Voir entrées (pour tester)
            list: true
            create: false
            update: false
            delete: false
            download: false # ❌ Pas de téléchargement
            export: false

        dashboard:
            read: true # ✅ Accéder au dashboard
            stats: false # ❌ Pas de stats détaillées

        admin:
            access: false
            settings: false

# ================================================================
# RÈGLES SPÉCIALES (optionnel)
# ================================================================
# Logiques particulières qui nécessitent du code custom
# ================================================================

special_rules:
    # Ownership check - Vérifier que l'utilisateur possède la ressource
    # Applicable pour: owner, editor, viewer (pas super_admin)
    ownership_required:
        - entity: site
          roles: [owner, editor, viewer]
          check: 'userOwnsSite(userId, siteId)'

        - entity: form
          roles: [owner, editor, viewer]
          check: "userOwnsResource(userId, formId, 'form')"

        - entity: inbox
          roles: [owner, editor, viewer]
          check: "userOwnsResource(userId, inboxId, 'inbox')"

    # Super admin bypass - super_admin peut tout faire sans ownership check
    bypass_ownership:
        role: super_admin

    # Rate limiting - Limiter créations pour beta
    rate_limiting:
        role: beta
        limits:
            - action: create
              entity: site
              max_per_day: 3

# ================================================================
# NOTES & QUESTIONS
# ================================================================
# Ajoute ici tes questions ou cas particuliers à discuter
# ================================================================

notes: |
    Questions à décider:

    1. Est-ce qu'un OWNER peut assigner des EDITORS/VIEWERS à ses sites ?
       → Actuellement prévu à true (owner.site.assign_users)

    2. Est-ce qu'un EDITOR peut supprimer des entrées inbox ?
       → Actuellement à false (lecture/export seulement)

    3. Est-ce que BETA doit pouvoir créer des formulaires ?
       → Actuellement à false (peut créer sites mais pas forms)

    4. Est-ce que VIEWER peut exporter en Excel ?
       → Actuellement à false (lecture seule stricte)

    5. Permissions granulaires par site (future) ?
       → Exemple: EDITOR peut update form sur site A mais pas site B
       → Nécessiterait une table site_user_permissions

