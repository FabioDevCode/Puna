# ================================================================
# TEMPLATE DE DÉFINITION DES PERMISSIONS
# ================================================================
# Instructions:
# 1. Pour chaque rôle, définir les permissions par entité
# 2. Utiliser true/false pour activer/désactiver une action
# 3. Ajouter des commentaires (#) pour expliquer les choix
# 4. Les actions possibles varient selon l'entité
#
# Format: permissions[role][entity][action] = boolean
# ================================================================

# ================================================================
# RÔLES DISPONIBLES (d'après user.attributes.json)
# ================================================================
roles:
    - super_admin # Administrateur système (accès total)
    - owner # Propriétaire de sites
    - editor # Éditeur (peut modifier)
    - viewer # Lecteur seul
    - beta # Testeur beta

# ================================================================
# ENTITÉS DU SYSTÈME (d'après models/)
# ================================================================
entities:
    - user # Utilisateurs du système
    - site # Sites web (domaines)
    - form # Formulaires liés à un site
    - inbox # Entrées de formulaires (données reçues)

# ================================================================
# MATRICE DES PERMISSIONS À COMPLÉTER
# ================================================================
# Remplis les valeurs true/false selon tes besoins
# Supprime ou commente les actions qui n'ont pas de sens
# ================================================================

permissions:
    # ------------------------------------------------------------
    # SUPER_ADMIN - Administrateur système
    # ------------------------------------------------------------
    super_admin:
        user:
            read: true # Voir détails d'un utilisateur
            create: true # Créer un utilisateur
            update: true # Modifier un utilisateur
            delete: true # Supprimer un utilisateur

        site:
            read: true # Voir détails d'un site
            create: true # Créer un site
            update: true # Modifier un site
            delete: true # Supprimer un site

        form:
            read: true # Voir détails d'un formulaire
            create: true # Créer un formulaire
            update: true # Modifier un formulaire (colonnes, template)
            delete: true # Supprimer un formulaire

        inbox:
            read: true # Voir une entrée de formulaire
            delete: true # Supprimer une entrée

    # ------------------------------------------------------------
    # OWNER - Propriétaire de sites
    # ------------------------------------------------------------
    # Peut gérer complètement SES sites (vérification ownership requise)
    # ------------------------------------------------------------
    owner:
        user:
            read: true # Voir détails d'un utilisateur
            create: true # Créer un utilisateur
            update: true # Modifier un utilisateur
            delete: true # Supprimer un utilisateur

        site:
            read: true # Voir détails d'un site
            create: true # Créer un site
            update: true # Modifier un site
            delete: true # Supprimer un site

        form:
            read: true # Voir détails d'un formulaire
            create: true # Créer un formulaire
            update: true # Modifier un formulaire (colonnes, template)
            delete: true # Supprimer un formulaire

        inbox:
            read: true # Voir une entrée de formulaire
            delete: true # Supprimer une entrée

    # ------------------------------------------------------------
    # EDITOR - Éditeur
    # ------------------------------------------------------------
    # Peut modifier mais pas créer/supprimer
    # Assigné à des sites spécifiques via SiteUser
    # ------------------------------------------------------------
    editor:
        user:
            read: false # Voir détails d'un utilisateur
            create: false # Créer un utilisateur
            update: false # Modifier un utilisateur
            delete: false # Supprimer un utilisateur

        site:
            read: true # Voir détails d'un site
            create: false # Créer un site
            update: false # Modifier un site
            delete: false # Supprimer un site

        form:
            read: true # Voir détails d'un formulaire
            create: true # Créer un formulaire
            update: true # Modifier un formulaire (colonnes, template)
            delete: true # Supprimer un formulaire

        inbox:
            read: true # Voir une entrée de formulaire
            delete: true # Supprimer une entrée

    # ------------------------------------------------------------
    # VIEWER - Lecteur seul
    # ------------------------------------------------------------
    # Lecture seule sur les sites assignés
    # ------------------------------------------------------------
    viewer:
        user:
            read: false # Voir détails d'un utilisateur
            create: false # Créer un utilisateur
            update: false # Modifier un utilisateur
            delete: false # Supprimer un utilisateur

        site:
            read: true # Voir détails d'un site
            create: false # Créer un site
            update: false # Modifier un site
            delete: false # Supprimer un site

        form:
            read: true # Voir détails d'un formulaire
            create: false # Créer un formulaire
            update: false # Modifier un formulaire (colonnes, template)
            delete: false # Supprimer un formulaire

        inbox:
            read: true # Voir une entrée de formulaire
            delete: false # Supprimer une entrée

    # ------------------------------------------------------------
    # BETA - Testeur beta
    # ------------------------------------------------------------
    # Utilisateur en phase de test (droits limités)
    # ------------------------------------------------------------
    beta:
        user:
            read: false # Voir détails d'un utilisateur
            create: false # Créer un utilisateur
            update: false # Modifier un utilisateur
            delete: false # Supprimer un utilisateur

        site:
            read: true # Voir détails d'un site
            create: true # Créer un site
            update: true # Modifier un site
            delete: true # Supprimer un site

        form:
            read: true # Voir détails d'un formulaire
            create: true # Créer un formulaire
            update: true # Modifier un formulaire (colonnes, template)
            delete: true # Supprimer un formulaire

        inbox:
            read: true # Voir une entrée de formulaire
            delete: true # Supprimer une entrée

# ================================================================
# RÈGLES SPÉCIALES (optionnel)
# ================================================================
# Logiques particulières qui nécessitent du code custom
# ================================================================

special_rules:
    # Rate limiting - Limiter créations pour beta
    rate_limiting:
        role: beta
        limits:
            - entity: site
              max: 4
            - entity: form
              max: 2
              info: 2 per site
            - entity: inbox
              max: 200
              info: 200 per form

# ================================================================
# NOTES & QUESTIONS
# ================================================================
# Ajoute ici tes questions ou cas particuliers à discuter
# ================================================================

notes: |
    - J'ai besoin d'un middleware afin de gérer l'accès à certaines
    routes qui prendrais 2 entrées, nom de l'entité, action.
    ex: actionAccess("user", "create")

    - il me faut le meme genre de middleware mais ou cette fois,
    je passe un tableau de string avec une liste de role.
    ex: roleAccess(["super_admin", "owner"])

    - il faudrait que dans le controller j'ai j'ai accès a une variable
    du genre "user_role" qui aurait le role du user connecté.
